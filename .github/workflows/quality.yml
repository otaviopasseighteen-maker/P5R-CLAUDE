
name: Site quality checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: find js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate service worker syntax
        run: node --check sw.js
      - name: Smoke test data and local links
        run: node tests/smoke.test.js
